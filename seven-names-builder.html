  const frame=document.getElementById("snrBuilderFrame");
  const sermonBtn=document.getElementById("snrSermonButton");
  const bibleBtn=document.getElementById("snrBibleStudyButton");
  const courseBtn=document.getElementById("snrBibleCourseButton");
  function decodeBase64(data){
    const binary=atob(data);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function mode(){
    if(location.hash==="#bible-course") return "bible-course";
    if(location.hash==="#bible-study") return "bible-study";
    return "sermon";
  }

  function withSiteBase(html){
    const pageBase=new URL("./",window.location.href).href;
    const baseTag='<base href="'+pageBase+'">';

    /* Old dashboard must never be a destination. */
    html=html
      .replaceAll('href="main.html"','href="personal-study.html"')
      .replaceAll("href='main.html'","href='personal-study.html'")
      .replaceAll('"main.html"','"personal-study.html"')
      .replaceAll("'main.html'","'personal-study.html'");

    if(/<base\b/i.test(html)){
      return html.replace(/<base\b[^>]*>/i,baseTag);
    }
    return html.replace(/<head([^>]*)>/i,'<head$1>'+baseTag);
  }

  function load(which){
    sermonBtn.classList.toggle("active",which==="sermon");
    bibleBtn.classList.toggle("active",which==="bible-study");
    courseBtn.classList.toggle("active",which==="bible-course");

    let data=sermonData;
    if(which==="bible-study") data=bibleData;
    if(which==="bible-course") data=courseData;

    const html=decodeBase64(data);
    frame.removeAttribute("src");
    frame.srcdoc=withSiteBase(html);
  }

  function switchTo(which){
    let target="#sermon";
    if(which==="bible-study") target="#bible-study";
    if(which==="bible-course") target="#bible-course";

    if(location.hash===target){
      load(which);
      return;
    }
    history.replaceState(null,"",target);
    load(which);
  }

  sermonBtn.addEventListener("click",()=>switchTo("sermon"));
  bibleBtn.addEventListener("click",()=>switchTo("bible-study"));
  courseBtn.addEventListener("click",()=>switchTo("bible-course"));
  load(mode());
})();
</script>

    const cameFromPersonalStudy =
      document.referrer &&
      /personal-study\.html(?:[?#].*)?$/i.test(new URL(document.referrer, location.href).pathname + new URL(document.referrer, location.href).search + new URL(document.referrer, location.href).hash);

    if(cameFromPersonalStudy && history.length > 1){
      history.back();
      return;
    }

    // If this page was entered from another Redemptive Names study page,
    // browser Back still preserves the previous study state better than a fresh load.
    if(document.referrer && history.length > 1){
      try{
        const ref=new URL(document.referrer,location.href);
        if(ref.origin===location.origin){
          history.back();
          return;
        }
      }catch(e){}
    }

    // Safe fallback for a fresh tab/direct visit.
    location.href='personal-study.html';
  }

  const selectors = ["[data-rns-main-back]"];
  selectors.forEach(function(selector){
    document.querySelectorAll(selector).forEach(function(el){
      el.addEventListener('click',returnToMain);
    });
  });

  window.rnsReturnToMainWithoutFreshLoad=returnToMain;
})();
</script>

<script id="rns-private-builder-live-session-final-2026">
(function(){
  'use strict';
  const frame=document.getElementById('snrBuilderFrame');
  const MODES=['sermon','bible-study','bible-course'];
  const PREFIX='rns.private.live.v4.';
  const NAME='RNSAPP:';
  let sessionId='';

  try{
    if(window.name&&window.name.startsWith(NAME)) sessionId=window.name.slice(NAME.length);
    else{
      sessionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
      window.name=NAME+sessionId;
    }
  }catch(e){sessionId='fallback-'+Date.now().toString(36);}

  function navType(){
    try{return performance.getEntriesByType('navigation')[0]?.type||'';}catch(e){return '';}
  }

  function key(mode){return PREFIX+mode;}
  function mode(){
    if(location.hash==='#bible-course')return 'bible-course';
    if(location.hash==='#bible-study')return 'bible-study';
    return 'sermon';
  }

  if(navType()==='reload'){
    MODES.forEach(m=>{try{localStorage.removeItem(key(m));}catch(e){}});
  }

  function doc(){
    try{return frame?.contentDocument||null;}catch(e){return null;}
  }

  function save(modeName){
    const d=doc(); if(!d?.body)return;
    const values={};
    [...d.querySelectorAll('input,textarea,select,[contenteditable="true"]')].forEach((el,i)=>{
      if(el.matches('input[type="password"],input[type="file"],input[type="button"],input[type="submit"],input[type="reset"]'))return;
      const k=el.id?'id:'+el.id:(el.name?'name:'+el.name+':'+i:'anon:'+el.tagName+':'+i);
      if(el.matches('[contenteditable="true"]')) values[k]={kind:'html',value:el.innerHTML};
      else if(el.type==='checkbox'||el.type==='radio') values[k]={kind:'checked',value:!!el.checked};
      else values[k]={kind:'value',value:el.value};
    });
    let scrollY=0; try{scrollY=frame.contentWindow?.scrollY||0;}catch(e){}
    try{localStorage.setItem(key(modeName),JSON.stringify({sessionId,values,scrollY,savedAt:Date.now()}));}catch(e){}
  }

  function restore(modeName){
    let data=null;
    try{data=JSON.parse(localStorage.getItem(key(modeName))||'null');}catch(e){}
    if(!data||data.sessionId!==sessionId)return;

    const apply=()=>{
      const d=doc(); if(!d?.body)return;
      [...d.querySelectorAll('input,textarea,select,[contenteditable="true"]')].forEach((el,i)=>{
        if(el.matches('input[type="password"],input[type="file"],input[type="button"],input[type="submit"],input[type="reset"]'))return;
        const k=el.id?'id:'+el.id:(el.name?'name:'+el.name+':'+i:'anon:'+el.tagName+':'+i);
        const s=data.values?.[k]; if(!s)return;
        if(s.kind==='html'&&el.matches('[contenteditable="true"]')) el.innerHTML=s.value;
        else if(s.kind==='checked') el.checked=!!s.value;
        else if(s.kind==='value'){
          if(el.tagName==='SELECT'){
            if(s.value!==''&&![...el.options].some(o=>o.value===s.value))return;
            if(el.value!==s.value){el.value=s.value;el.dispatchEvent(new Event('change',{bubbles:true}));}
          }else if(el.value!==s.value){
            el.value=s.value;
            el.dispatchEvent(new Event('input',{bubbles:true}));
          }
        }
      });
    };

    [0,200,600,1200].forEach(ms=>setTimeout(apply,ms));
    setTimeout(()=>{try{frame.contentWindow?.scrollTo(0,Number(data.scrollY)||0);}catch(e){}},1300);
  }

  let currentMode=mode();
  frame?.addEventListener('load',()=>{
    currentMode=mode();
    restore(currentMode);
    const d=doc();
    if(d){
      let timer=null;
      const schedule=()=>{clearTimeout(timer);timer=setTimeout(()=>save(currentMode),100);};
      d.addEventListener('input',schedule,true);
      d.addEventListener('change',schedule,true);
      d.addEventListener('click',()=>setTimeout(schedule,0),true);
    }
  });

  ['snrSermonButton','snrBibleStudyButton','snrBibleCourseButton'].forEach(id=>{
    document.getElementById(id)?.addEventListener('click',()=>save(currentMode),true);
  });

  window.addEventListener('pagehide',()=>save(currentMode));
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden')save(currentMode);
  });
})();
</script>
