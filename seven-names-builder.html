  const frame=document.getElementById("snrBuilderFrame");
  const sermonBtn=document.getElementById("snrSermonButton");
  const bibleBtn=document.getElementById("snrBibleStudyButton");
  let activeBlobUrl=null;

  function decodeBase64(data){
    const binary=atob(data);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function mode(){
    return location.hash==="#bible-study" ? "bible-study" : "sermon";
  }

  function load(which){
    sermonBtn.classList.toggle("active",which==="sermon");
    bibleBtn.classList.toggle("active",which==="bible-study");
    if(activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
    const html=decodeBase64(which==="bible-study" ? bibleData : sermonData);
    activeBlobUrl=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    frame.src=activeBlobUrl;
  }

  function switchTo(which){
    const target=which==="bible-study" ? "#bible-study" : "#sermon";
    if(location.hash===target) location.reload();
    else {
      location.hash=target;
      location.reload();
    }
  }

  sermonBtn.addEventListener("click",()=>switchTo("sermon"));
  bibleBtn.addEventListener("click",()=>switchTo("bible-study"));
  load(mode());
})();
