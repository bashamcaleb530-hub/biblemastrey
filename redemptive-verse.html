<body>
  <header>
    <h1>Redemptive Names Software</h1>
    <p>Seven Redemptive Names of God — Verse Teaching</p>
  </header>

  <main class="container">
    <button id="backButton" class="back-button" type="button">← Back to Personal Study</button>

    <section class="redemptive-page" aria-live="polite">
      <div class="page-header">
        <div>
          <h2 id="title">Verse Teaching</h2>
          <p id="reference">Loading verse…</p>
        </div>
      </div>

      <div id="notice" class="notice"></div>

      <article class="teaching-card verse-card">
        <div class="badge">Bible Verse</div>
        <div id="verse" class="verse-text"></div>
      </article>

      <div id="connections" class="connections"></div>

      <div class="navigation">
        <button id="previous" class="reader-nav-button" type="button">← Previous Verse</button>
        <button id="next" class="reader-nav-button" type="button">Next Verse →</button>
      </div>
    </section>
  </main>

  <script>
    const profiles = [
      {
        id: "jireh",
        name: "Jehovah-Jireh",
        meaning: "The LORD will provide",
        references: ["genesis 22:14", "philippians 4:19", "2 corinthians 9:8", "matthew 6:31-33"],
        keywords: ["provide", "provided", "provision", "need", "abundant life", "richly supplies"],
        teaching: "This verse connects with Jehovah-Jireh: the LORD will provide. Bring the need to the Father and seek His direction in His Word. His provision is part of the life He has provided in Christ; this is not a promise that every answer must appear immediately, but it is a call to trust Him and continue in fellowship while you seek and obey His direction.",
        direction: "Ask: What need am I bringing to the Father? What has He already provided in Christ? What truth and direction do I need to receive and apply today?"
      },
      {
        id: "rapha",
        name: "Jehovah-Rapha",
        meaning: "The LORD who heals",
        references: ["exodus 15:26", "psalm 103:2-3", "isaiah 53:5", "james 5:15"],
        keywords: ["heal", "healed", "healing", "health", "sickness", "disease", "wounds", "brokenhearted"],
        teaching: "This verse connects with Jehovah-Rapha: the LORD who heals. Healing may concern the body, the emotions, or the inward wounds of life. Bring the need to the Father instead of hiding, stay in fellowship with Him, receive truth from His Word, and follow the direction He gives. Do not measure God's faithfulness only by how quickly the result appears.",
        direction: "Ask: What part of my life needs the Father's healing? What truth is He showing me? How can I continue seeking Him and walking in the help He provides?"
      },
      {
        id: "nissi",
        name: "Jehovah-Nissi",
        meaning: "The LORD is my banner",
        references: ["exodus 17:15", "romans 8:37", "1 corinthians 15:57", "2 corinthians 2:14", "ephesians 6:10"],
        keywords: ["victory", "overcome", "overcometh", "triumph", "strong in the lord", "mighty", "deliver", "battle"],
        teaching: "This verse connects with Jehovah-Nissi: the LORD is my banner. The believer's victory is in Christ. We do not try to create a victory that God has not provided; we learn to reign in the victory of Christ, draw strength from the Lord and the power of His might, receive truth, believe it, and apply it.",
        direction: "Ask: Where am I trying to fight in my own strength? What victory has Christ already provided? What truth must I believe and practice in this battle?"
      },
      {
        id: "shalom",
        name: "Jehovah-Shalom",
        meaning: "The LORD is peace",
        references: ["judges 6:24", "romans 5:1", "philippians 4:6-7", "isaiah 26:3", "john 14:27"],
        keywords: ["peace", "quietness", "rest", "calm", "anxiety", "troubled", "fear not"],
        teaching: "This verse connects with Jehovah-Shalom: the LORD is peace. In your teaching, peace is connected with right standing before God and with bringing prayer to Him. Because of what Christ has provided, the believer can come to the Father instead of hiding, give thanks, receive direction, and walk in the peace God supplies.",
        direction: "Ask: What is disturbing my peace? What does right standing with God mean for this situation? What should I bring to the Father with thanksgiving and faith?"
      },
      {
        id: "raah",
        name: "Jehovah-Ra’ah / Jehovah-Rohi",
        meaning: "The LORD is my shepherd",
        references: ["psalm 23:1", "psalm 23:2-4", "john 10:11", "john 10:27-28", "1 peter 2:25"],
        keywords: ["shepherd", "guide", "guideth", "led", "leadeth", "path", "ways", "voice", "pasture"],
        teaching: "This verse connects with Jehovah-Ra’ah, also written Jehovah-Rohi: the LORD is my shepherd. The Shepherd guides, leads, and cares for His people. When you do not know what to do, continue in fellowship with the Father, remain in His Word, listen for His direction, and follow the next step He makes clear.",
        direction: "Ask: What decision or battle needs the Shepherd's direction? Am I willing to follow the truth He gives, even when the whole path is not yet visible?"
      },
      {
        id: "tsidkenu",
        name: "Jehovah-Tsidkenu",
        meaning: "The LORD our righteousness",
        references: ["jeremiah 23:6", "romans 5:1", "2 corinthians 5:21", "hebrews 4:16", "ephesians 6:10"],
        keywords: ["righteousness", "justified", "justification", "right standing", "boldly", "mercy", "grace", "come boldly"],
        teaching: "This verse connects with Jehovah-Tsidkenu: the LORD our righteousness. This is foundational to understanding the other names. Our right standing is not produced by hiding, self-condemnation, or our own performance. Through Jesus, the believer can come boldly to the Father in faith for mercy and help, receive what Christ has provided, and then walk in the truth instead of remaining under condemnation.",
        direction: "Ask: Am I approaching God from condemnation or from the right standing Christ has provided? What would it look like to come boldly, receive mercy and help, and obey the truth He gives?"
      },
      {
        id: "shammah",
        name: "Jehovah-Shammah",
        meaning: "The LORD is there",
        references: ["ezekiel 48:35", "matthew 28:20", "hebrews 13:5-6", "psalm 46:1", "deuteronomy 31:8"],
        keywords: ["with you", "with thee", "never leave", "never forsake", "presence", "there", "near", "refuge"],
        teaching: "This verse connects with Jehovah-Shammah: the LORD is there. God is present with His people. In temptation, fear, discouragement, or a repeated struggle, run to God instead of hiding. Continue in fellowship, remain under His care, and draw on the strength He has already provided rather than treating the battle as if you are alone.",
        direction: "Ask: Where am I acting as though I am alone? How does the Father's presence change my next choice, my words, and the way I respond to this battle?"
      }
    ];

    const stateKey = "biblemasteryRedemptiveVerseState";
    let state = null;
    let verses = [];
    let index = 0;

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[’']/g, "")
        .replace(/^psalms\s+/, "psalm ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function verseReference(result) {
      return [result.book, result.chapter + ":" + result.verse].join(" ");
    }

    // Curated verse-to-name connections based on Caleb's teaching.
    // For any verse listed here, these hand-taught connections are authoritative.
    // That means the page will NOT add extra names just because a keyword happens
    // to appear in the English verse text.
    const curatedConnections = {
      "psalm 34:4": ["shammah", "raah", "shalom", "nissi"]
    };

    /*
      Verse-specific explanations from Caleb's teaching.
      Each connection has two parts:
      1. How the Redemptive Name connects to the verse.
      2. What that truth means for the person reading the verse.
    */
    const curatedVerseTeaching = {
      "psalm 34:4": {
        shammah: {
          verse:
            "David says, “I sought the LORD.” This connects with Jehovah-Shammah because David turns toward the Lord as One who is present and available to him. He does not face his fears as though God were absent; he seeks the Lord in fellowship.",
          reader:
            "When you are afraid, do not live as though you are alone. Turn to the Father instead of hiding. Stay in fellowship with Him, seek Him, and remember that His presence is part of how you face the fear rather than being ruled by it."
        },
        raah: {
          verse:
            "David’s response to fear is to seek the LORD. This connects with Jehovah-Ra’ah / Jehovah-Rohi because the Shepherd is the One David looks to for help, direction, and the way forward instead of depending only on himself.",
          reader:
            "When you do not know what to do with fear or another battle, look to the Lord as your Shepherd. Seek His direction in His Word, listen for the truth He is showing you, and follow the next step He makes clear."
        },
        shalom: {
          verse:
            "Fear is the problem named in this verse, and David’s seeking of the LORD ends in deliverance from those fears. This connects with Jehovah-Shalom because fellowship with God and receiving His truth moves the believer out of fear and into the peace He supplies.",
          reader:
            "If fear is disturbing your peace, bring it to the Father instead of letting fear control your thoughts and words. Continue seeking Him and receiving His truth until that truth becomes established in you and you are walking in His peace."
        },
        nissi: {
          verse:
            "The words “He delivered me from all my fears” show the victory in this verse. This connects with Jehovah-Nissi because the LORD is David’s source of deliverance. David does not present himself as the source of the victory; the Lord delivered him.",
          reader:
            "When you are facing fear, do not depend only on your own strength to defeat it. Draw strength from the Lord and the power of His might. Receive the truth He gives you, believe it, apply it, and learn to walk in the victory He has provided."
        }
      }
    };

    function registerTeaching(reference, names, teaching) {
      const ref = normalize(reference);
      curatedConnections[ref] = Array.isArray(names) ? names.slice() : [];
      curatedVerseTeaching[ref] = teaching || {};
    }

    function registerRange(chapter, startVerse, endVerse, names, teachingBuilder) {
      for (let verseNumber = startVerse; verseNumber <= endVerse; verseNumber += 1) {
        const ref = "genesis " + chapter + ":" + verseNumber;
        registerTeaching(
          ref,
          typeof names === "function" ? names(verseNumber) : names,
          typeof teachingBuilder === "function" ? teachingBuilder(verseNumber) : teachingBuilder
        );
      }
    }

    function pair(verse, reader) {
      return { verse: verse, reader: reader };
    }

    const creationOrderActions = {
      6: "God established the firmament and divided the waters, putting creation into the order He intended.",
      7: "God made the firmament and separated the waters according to His design.",
      8: "God named the firmament Heaven and continued establishing order in creation.",
      9: "God gathered the waters together and caused the dry land to appear, showing that He knows where everything belongs.",
      10: "God named the dry land Earth and the gathered waters Seas, and He saw that it was good.",
      11: "God commanded the earth to bring forth grass, herbs, and fruit trees, each according to its proper kind.",
      12: "The earth brought forth vegetation according to God’s order, and God saw that it was good.",
      13: "The third day was completed according to the order God had established.",
      14: "God appointed lights in the firmament to divide day from night and to mark signs, seasons, days, and years.",
      15: "God appointed the lights to give light upon the earth, giving them a clear purpose.",
      16: "God made the greater light, the lesser light, and the stars, giving each its place and function.",
      17: "God set the lights in the firmament of heaven to give light upon the earth.",
      18: "God gave the lights rule over day and night and used them to divide light from darkness, and He saw that it was good.",
      19: "The fourth day was completed according to God’s order.",
      20: "God commanded the waters to bring forth living creatures and the heavens to be filled with birds.",
      21: "God created the great sea creatures, every living thing in the waters, and every winged bird according to its kind, and He saw that it was good.",
      22: "God blessed the living creatures and gave them the ability and command to multiply.",
      23: "The fifth day was completed according to God’s order.",
      24: "God commanded the earth to bring forth living creatures according to their kinds.",
      25: "God made the animals according to their kinds and saw that His work was good."
    };

    function creationOrderTeaching(verseNumber) {
      const action = creationOrderActions[verseNumber] ||
        "God continued ordering His creation according to His righteous purpose.";

      return {
        tsidkenu: pair(
          action + " This connects with Jehovah-Tsidkenu because God is righteous, good, wise, and all-powerful. He knows the proper order, purpose, and place of what He creates.",
          "God is righteous and all-powerful, so there is nothing impossible for Him. When something in your life seems confused, out of order, or beyond your ability to change, you can trust Him to know what belongs where and what needs to happen. Stay in fellowship with Him, remain in His Word, and let His truth guide you as He brings His order into your thinking, decisions, and circumstances."
        )
      };
    }

    function closingCreationTeaching(verseNumber) {
      return {
        tsidkenu: pair(
          "This verse is part of the closing section of creation where God makes mankind in His image, gives mankind purpose and stewardship, and declares His creation good. It connects with Jehovah-Tsidkenu because God is righteous and created mankind according to His good design, with responsibility to rule and steward what He made.",
          "Your life has purpose. God is righteous, and the responsibilities He places in your hands matter. You can trust Him to show you how to handle your work, relationships, possessions, ministry, animals, and other responsibilities in a way that reflects His righteousness."
        ),
        jireh: pair(
          "This verse stands in the section where God provided mankind with the earth, its fruitfulness, food, and everything needed for life. It connects with Jehovah-Jireh because God did not create people and then leave them without provision.",
          "God knows what you need. You can look to Him as your Provider rather than living as though everything depends entirely on you. Follow His direction and use wisely what He places in your hands."
        ),
        rapha: pair(
          "This verse belongs to the creation account before sickness, disease, and corruption had entered human experience. It connects with Jehovah-Rapha because God’s original creation was whole and good, with nothing that needed healing.",
          "This shows that sickness and disease were not part of the goodness seen in God’s original creation. You can look to Jehovah-Rapha as the One whose character and provision are connected with healing and wholeness, continuing in fellowship with Him even when healing is a process."
        ),
        shalom: pair(
          "This verse is part of a creation that God would soon call very good. Mankind had provision, purpose, relationship with God, and an ordered world. This connects with Jehovah-Shalom because there was wholeness and peace in God’s good design.",
          "God’s peace is more than a calm feeling. It is connected with wholeness and with trusting Him while He is present, guiding, and providing. Even when your present circumstances are not perfect, you can have peace through faith because God is with you and remains your Shepherd."
        ),
        shammah: pair(
          "God was there with mankind in this creation account. He did not create people from a distance and disappear. This connects with Jehovah-Shammah because His presence was part of mankind’s life from the beginning.",
          "God has not abandoned you. You can seek Him because He is present. Whatever responsibility or situation you face, you do not have to approach it as though God is absent."
        ),
        raah: pair(
          "God gave mankind responsibility over the earth, but mankind still needed God’s direction to know how to live and steward what He had made. This connects with Jehovah-Ra’ah / Jehovah-Rohi because the Shepherd is present to lead and guide.",
          "Having responsibility does not mean you are supposed to know everything on your own. Stay in fellowship with God, listen to His Word and direction, and allow Him to show you how to handle what He has placed in your care."
        )
      };
    }

    // -------------------------
    // GENESIS 1 — Caleb's teaching
    // -------------------------

    registerTeaching("genesis 1:1", ["tsidkenu", "shammah"], {
      tsidkenu: pair(
        "God is righteous, and everything He created was made right and good according to His perfect nature. Nothing wrong, corrupt, or defective came from Him. Creation began according to His righteous design.",
        "When you look at God as Creator, begin with the truth that He is righteous, good, and all-powerful. What He does is right. You can trust Him, His Word, and His purposes even when you do not yet understand everything."
      ),
      shammah: pair(
        "The words “In the beginning God” show that God was already there. He did not arrive later. He was present before creation and remains present now.",
        "The God who was there in the beginning is still present with you now. He does not leave or disappear. Whatever you face, you can turn to Him, seek Him, and remain in fellowship with Him because He is always present."
      )
    });

    registerTeaching("genesis 1:2", ["shammah", "raah", "shalom"], {
      shammah: pair(
        "The Spirit of God moved upon the face of the waters. Even in darkness and before the earth had been brought into order, God was there and His presence was active.",
        "When your situation feels dark, empty, confused, or without direction, God has not disappeared. He can be present and working even before you see what He is doing. Remain in fellowship with Him instead of assuming darkness means He is absent."
      ),
      raah: pair(
        "The Spirit of God was moving, brooding, and hovering over the waters. This connects with Jehovah-Ra’ah / Jehovah-Rohi because God does nothing without His Spirit, and the Shepherd leads and directs what He is bringing about.",
        "You do not have to direct your life entirely by your own understanding. Look to God for direction, stay close to Him, remain in His Word, listen for His leading, and follow the next step He makes clear."
      ),
      shalom: pair(
        "Darkness was upon the face of the deep, yet the Spirit of God was hovering over the waters. God’s presence was there in the middle of the darkness, which connects with Jehovah-Shalom.",
        "You can have peace through faith because God is there and because He is your Shepherd, even before the darkness changes. His presence and guidance give you peace while He is still working."
      )
    });

    registerTeaching("genesis 1:3", ["tsidkenu", "nissi", "shalom"], {
      tsidkenu: pair(
        "God brought light into the midst of darkness. This shows His righteousness because what comes from Him is right and good, and it shows His power because darkness did not prevent Him from bringing light.",
        "When you face darkness, confusion, or something that seems wrong, remember that God is righteous and all-powerful. His Word brings truth and light, and there is no situation beyond His ability to change."
      ),
      nissi: pair(
        "There was darkness, but when God spoke, there was light. Darkness did not have the final word. This connects with Jehovah-Nissi because where darkness existed, God brought victory through light.",
        "Do not treat darkness as though it has already won. Look to the Lord as your victory. His truth can bring light into what is dark, and you can learn to walk in the victory He provides rather than being ruled by the darkness."
      ),

          "God's provision can be abundant. When increase creates new responsibilities or decisions, continue seeking His direction so that what He has provided is handled with wisdom and peace."
        )
      };
    });

    registerRange(13, 14, 18, ["jireh"], function(verseNumber) {
      return {
        jireh: pair(
          "After Lot separated from Abram, the Lord again showed Abram the land He would give to him and his seed. Abram had already been greatly blessed, but now he was in the position God had intended for him. Sometimes we bring someone with us because we love them, even when that was not what God directed. God can still bless us, but when things come into the order He intended, we may be in a better position to receive what He wants to provide.",
          "Love for people should not replace obedience to God's direction. Stay close to Him and let Him show you what belongs in the path He has called you to walk. His provision is best received while following His leading."
        )
      };
    });

    // -------------------------
    // GENESIS 14 — Caleb's teaching
    // -------------------------

    registerRange(14, 14, 16, ["shammah", "nissi"], function(verseNumber) {
      return {
        shammah: pair(
          "God was with Abram as he went after the kings who had taken Lot and the others captive. This connects with Jehovah-Shammah because Abram was not facing the battle as though God were absent.",
          "When you face a battle, remember that God is present. Stay in fellowship with Him and do not approach the situation as though everything depends only on you."
        ),
        nissi: pair(
          "Abram defeated the enemy, recovered the people and possessions, and brought Lot back. This connects with Jehovah-Nissi because God brought victory through Abram.",
          "Victory comes from the Lord. Draw strength from Him, follow His direction, and allow Him to work through you rather than depending only on your own strength."
        )
      };
    });

    registerRange(14, 21, 23, ["jireh"], function(verseNumber) {
      return {
        jireh: pair(
          "Abram refused to take the king of Sodom's possessions because he did not want the king to be able to say, 'I have made Abram rich.' Abram wanted it to be clear that God was his Provider, and the Lord had already blessed him greatly.",
          "Look to God as your source. Do not let dependence on people replace your trust in the Lord. Receive help when He leads you to, but keep your confidence rooted in Jehovah-Jireh."
        )
      };
    });

    // -------------------------
    // GENESIS 15 — Caleb's teaching
    // -------------------------

    registerTeaching("genesis 15:1", ["raah", "jireh"], {
      raah: pair(
        "God told Abram, 'I am thy shield.' A shepherd protects his flock, so this connects with Jehovah-Ra'ah / Jehovah-Rohi. God Himself was Abram's protection.",
        "Look to the Lord as your Shepherd and protector. You do not have to live ruled by fear when the One guiding you is also able to protect and care for you."
      ),
      jireh: pair(
        "God told Abram that He was his exceeding great reward. This connects with Jehovah-Jireh because Abram's greatest provision was not cattle, silver, gold, or land, but God Himself.",
        "Do not reduce God's provision to material things. The greatest gift is the Provider Himself. Stay in fellowship with Him and let every other provision remain secondary to knowing Him."
      )
    });

    registerRange(15, 2, 5, ["jireh"], function(verseNumber) {
      return {
        jireh: pair(
          "Abram was concerned because he had no child of his own, but God promised that an heir would come from Abram himself. Then God showed him the stars and promised that his descendants would become exceedingly numerous. This connects with Jehovah-Jireh because God would provide far beyond Abram's immediate need.",
          "God can see provision that you cannot yet see. Do not measure His ability only by what is presently visible. Continue trusting His promise and following His direction."
        )
      };
    });

    registerTeaching("genesis 15:7", ["raah"], {
      raah: pair(
        "God reminded Abram that He was the One who brought him out of Ur of the Chaldees and led him to the land He intended to give him. This connects with Jehovah-Ra'ah / Jehovah-Rohi because a shepherd guides and leads his sheep.",
        "Remember how God has already led you. When you need direction now, continue looking to the Shepherd who has been guiding you and follow the next step He makes clear."
      )
    });

    registerRange(15, 18, 21, ["jireh"], function(verseNumber) {
      return {
        jireh: pair(
          "God confirmed His covenant with Abram and reminded him of the land He had already promised and was providing for him and his descendants. This connects with Jehovah-Jireh because the Lord not only promises provision but faithfully establishes what He provides.",
          "Remember what God has already provided and what He has spoken. Let His past faithfulness strengthen your trust in Him as your Provider while you continue following His direction."
        )
      };
    });

    // -------------------------
    // GENESIS 16 — Caleb's teaching
    // -------------------------

    registerRange(16, 7, 9, ["shammah"], function(verseNumber) {
      return {
        shammah: pair(
          "The angel of the LORD found Hagar in the wilderness, spoke directly to her, and gave her direction. This connects with Jehovah-Shammah because the Lord was there with Hagar in a place where she could easily have felt unseen, alone, and forgotten.",
          "When you feel overlooked or alone, remember that God sees you and is present. Do not assume that isolation means He has abandoned you. Stay open to His direction and follow what He makes clear, even when the next step requires trust and obedience."
        )
      };
    });

    registerTeaching("genesis 16:10", ["jireh"], {
      jireh: pair(
        "The angel of the LORD promised Hagar that her descendants would be multiplied exceedingly. This connects with Jehovah-Jireh because God was not only present with Hagar; He also spoke provision and increase into her future.",
        "God can provide beyond what you can see in the present moment. When your current circumstances seem small, uncertain, or restricted, remember that His provision is not limited to what is visible today. Trust Him with the future while you follow His direction now."
      )
    });

    function matchedKeywordsFor(profile, result) {
      const verseText = normalize(result.text);
      return profile.keywords.filter(function(keyword) {
        return verseText.includes(normalize(keyword));
      });
    }

    function buildVerseConnection(profile, result) {
      const reference = normalize(verseReference(result));
      const curated =
        curatedVerseTeaching[reference] &&
        curatedVerseTeaching[reference][profile.id];

      if (curated) return curated.verse;

      const keywords = matchedKeywordsFor(profile, result);
      const exactReference = profile.references.some(function(item) {
        return normalize(item) === reference;
      });

      if (keywords.length) {
        return (
          "This verse contains the theme “" + keywords[0] + ",” which connects with " +
          profile.name + " — " + profile.meaning + ". The connection comes from what this verse is actually saying, not merely from the name being placed beside it."
        );
      }

      if (exactReference) {
        return (
          verseReference(result) + " is one of the passages directly connected with " +
          profile.name + " — " + profile.meaning +
          ". Read the verse in its setting and notice how its message expresses that part of the Lord’s redemptive provision."
        );
      }

      return (
        "This verse connects with " + profile.name + " — " + profile.meaning +
        " through the teaching theme found in this passage."
      );
    }

    function buildReaderApplication(profile, result) {
      const reference = normalize(verseReference(result));
      const curated =
        curatedVerseTeaching[reference] &&
        curatedVerseTeaching[reference][profile.id];

      if (curated) return curated.reader;

      const applications = {
        jireh:
          "As you read this verse, identify the need before you and bring it to the Father. Look to what He has provided in Christ, remain in His Word, and follow the direction He gives instead of letting the need become the only thing you see.",
        rapha:
          "As you read this verse, bring the area that needs healing to the Father instead of hiding it. Continue in fellowship with Him, receive truth from His Word, and keep following His direction even when the result is not immediate.",
        nissi:
          "As you read this verse, ask where you have been trying to fight in your own strength. Draw strength from the Lord, receive the truth He gives you, believe it, apply it, and walk in the victory Christ has provided.",
        shalom:
          "As you read this verse, notice what is disturbing your peace. Come to the Father from your right standing in Christ, bring the matter to Him with thanksgiving and faith, receive His direction, and let His truth govern your thoughts instead of fear.",
        raah:
          "As you read this verse, look to the Lord as your Shepherd. You may not see the whole path yet, but you can stay in fellowship with Him, remain in His Word, listen for His direction, and obey the next step He makes clear.",
        tsidkenu:
          "As you read this verse, remember that your approach to the Father is not based on self-condemnation or your own performance. Come boldly because of what Christ has provided, receive mercy and help, and then walk in the truth He shows you.",
        shammah:
          "As you read this verse, remember that you are not facing the situation as though God were absent. Turn toward the Father instead of hiding, remain in fellowship with Him, and draw on the strength and help He has already provided."
      };

      return applications[profile.id] || profile.direction;
    }

    function findProfiles(result) {
      const reference = normalize(verseReference(result));

      // Once Caleb has taught a verse, his curated list is authoritative.
      // This also allows an intentionally empty list for verses where he does
      // not see a genuine Redemptive Name connection.
      if (Object.prototype.hasOwnProperty.call(curatedConnections, reference)) {
        const curatedIds = new Set(curatedConnections[reference] || []);
        return profiles.filter(function(profile) {
          return curatedIds.has(profile.id);
        });
      }

      // Untaught verses can still use the older reference/keyword fallback
      // until Caleb reaches them in the verse-by-verse study.
      const text = normalize(result.text);
      const matchedIds = new Set();

      profiles.forEach(function(profile) {
        const exactReferenceMatch = profile.references.some(function(item) {
          return normalize(item) === reference;
        });

        const keywordMatch = profile.keywords.some(function(keyword) {
          return text.includes(normalize(keyword));
        });

        if (exactReferenceMatch || keywordMatch) {
          matchedIds.add(profile.id);
        }
      });

      return profiles.filter(function(profile) {
        return matchedIds.has(profile.id);
      });
    }

    function renderConnectionCard(profile, result) {
      const card = document.createElement("article");
      card.className = "connection-card";

      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = profile.name;

      const meaning = document.createElement("h3");
      meaning.textContent = profile.meaning;

      const verseHeading = document.createElement("h3");
      verseHeading.textContent = "How this name connects to this verse";

      const verseConnection = document.createElement("div");
      verseConnection.className = "teaching-text";
      verseConnection.textContent = buildVerseConnection(profile, result);

      const readerHeading = document.createElement("h3");
      readerHeading.textContent = "What this means for you";

      const readerApplication = document.createElement("div");
      readerApplication.className = "teaching-text";
      readerApplication.textContent = buildReaderApplication(profile, result);

      const reflectionHeading = document.createElement("h3");
      reflectionHeading.textContent = "Consider this as you seek the Father";

      const reflection = document.createElement("div");
      reflection.className = "teaching-text";
      reflection.textContent = profile.direction;

      card.appendChild(badge);
      card.appendChild(meaning);
      card.appendChild(verseHeading);
      card.appendChild(verseConnection);
      card.appendChild(readerHeading);
      card.appendChild(readerApplication);
      card.appendChild(reflectionHeading);
      card.appendChild(reflection);
      return card;
    }

    function render() {
      const result = verses[index];
      if (!result) return showError("No verse was supplied. Return to Personal Study and click a verse again.");

      const matches = findProfiles(result);
      const connections = document.getElementById("connections");

      document.title = verseReference(result) + " - Redemptive Names Software";
      document.getElementById("reference").textContent = verseReference(result) + " • " + ((state && state.translation) || "KJV");
      document.getElementById("verse").textContent = result.text || "The verse text is not available.";
      connections.innerHTML = "";

      if (matches.length) {
        document.getElementById("notice").textContent =
          "This verse connects with " + matches.length +
          (matches.length === 1 ? " Redemptive Name" : " Redemptive Names") +
          ". Each section below explains how the name connects to this verse and what that truth means for you as you read it.";

        matches.forEach(function(profile) {
          connections.appendChild(renderConnectionCard(profile, result));
        });
      } else {
        document.getElementById("notice").textContent =
          "No direct Redemptive Name connection is currently defined for this verse. BibleMastery will not force a connection that is not part of your teaching.";

        const card = document.createElement("article");
        card.className = "connection-card";
        card.innerHTML =
          '<div class="badge">No direct match found</div>' +
          '<h3>Continue studying the passage</h3>' +
          '<div class="teaching-text">Continue reading the surrounding passage and seek the Father\'s direction. When this verse has a clear connection in your teaching, it can be added to the curated verse connections.</div>';
        connections.appendChild(card);
      }

      document.getElementById("previous").disabled = index <= 0;
      document.getElementById("next").disabled = index >= verses.length - 1;
      const currentParams = new URLSearchParams(window.location.search);
      currentParams.set("index", String(index));
      history.replaceState(null, "", "redemptive-verse.html?" + currentParams.toString());
    }

    function showError(message) {
      document.getElementById("reference").textContent = "Verse teaching unavailable";
      document.getElementById("notice").innerHTML = "<div class=\"error\">" + message + "</div>";
      const connections = document.getElementById("connections");
      if (connections) connections.innerHTML = "";
      document.getElementById("previous").disabled = true;
      document.getElementById("next").disabled = true;
    }

    function goBack() {
      if (document.referrer && document.referrer.includes("personal-study.html")) {
        history.back();
      } else {
        window.location.href = "personal-study.html";
      }
    }

    try {
      const params = new URLSearchParams(window.location.search);
      state = JSON.parse(localStorage.getItem(stateKey) || "null");
      verses = state && Array.isArray(state.verses) ? state.verses : [];

      const fallbackVerse = {
        book: params.get("book") || "",
        chapter: params.get("chapter") || "",
        verse: params.get("verse") || "",
        text: params.get("text") || ""
      };

      if (!verses.length && fallbackVerse.book && fallbackVerse.chapter && fallbackVerse.verse) {
        verses = [fallbackVerse];
        state = {
          verses: verses,
          index: 0,
          translation: params.get("translation") || "KJV",
          topic: params.get("topic") || ""
        };
      }

      const requestedIndex = Number(params.get("index"));
      index = Number.isInteger(requestedIndex) ? requestedIndex : (state && Number.isInteger(state.index) ? state.index : 0);
      index = Math.max(0, Math.min(index, Math.max(0, verses.length - 1)));
    } catch (error) {
      showError("The verse information could not be read. Return to Personal Study and click a verse again.");
    }

    document.getElementById("backButton").addEventListener("click", goBack);
    document.getElementById("previous").addEventListener("click", function() {
      if (index > 0) { index--; render(); window.scrollTo({top: 0, behavior: "smooth"}); }
    });
    document.getElementById("next").addEventListener("click", function() {
      if (index < verses.length - 1) { index++; render(); window.scrollTo({top: 0, behavior: "smooth"}); }
    });
    render();
  </script>
